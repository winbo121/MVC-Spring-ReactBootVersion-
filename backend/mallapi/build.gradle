plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zerock'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok' //롬복사용
	testAnnotationProcessor 'org.projectlombok:lombok' //테스트에서 롬복사용
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta' //jpaQueryFactory 이용
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta" //jpaQueryFactory 이용
	annotationProcessor "jakarta.annotation:jakarta.annotation-api" //jpaQueryFactory 이용
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"  //jpaQueryFactory 이용
	implementation 'org.modelmapper:modelmapper:3.1.1' // dto에서 entity로 변환가능한 라이브러리 또는 entity에서 dto로 변환가능 (RootConfig에서 ModelMapper사용)
}

tasks.named('test') {
	useJUnitPlatform()
}
